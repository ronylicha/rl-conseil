<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pix2Clip">
  <defs>
    <linearGradient id="pix2clipGradientDark" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </linearGradient>
  </defs>

  <!-- Picto: frame + play triangle (pixels -> clip) -->
  <g transform="translate(14, 24)">
    <rect x="2" y="2" width="48" height="48" rx="10" stroke="url(#pix2clipGradientDark)" stroke-width="4" fill="none"/>
    <path d="M22 17 L37 26 L22 35 Z" fill="url(#pix2clipGradientDark)"/>
  </g>

  <!-- Wordmark: PIX2CLIP -->
  <text x="78" y="66"
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
        font-size="44" font-weight="900" letter-spacing="-1.2"
        fill="url(#pix2clipGradientDark)">
    PIX2CLIP
  </text>
</svg>
